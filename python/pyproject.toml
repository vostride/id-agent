[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "id-agent"
version = "1.1.1"
description = "Human-readable, token-efficient IDs for AI agent systems"
readme = { text = "id-agent is a human-readable, token-efficient ID library for AI agent systems. Full documentation lives in the root README at https://github.com/vostride/id-agent#readme.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Vostride" },
]
keywords = [
  "ai",
  "agent",
  "collision-resistant",
  "human-readable",
  "id",
  "identifier",
  "llm",
  "token-efficient",
  "uuid-alternative",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vostride/id-agent#readme"
Repository = "https://github.com/vostride/id-agent"
Issues = "https://github.com/vostride/id-agent/issues"

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "pytest>=9.0",
  "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/id_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/id_agent/**/*.py",
  "/src/id_agent/py.typed",
  "/tests/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
