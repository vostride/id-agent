name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir js lint
      - run: pnpm --dir js format:check
      - run: pnpm --dir js build
      - run: pnpm --dir js test
      - run: pnpm --dir js size
      - run: pnpm --dir js publint
      - run: pnpm --dir js attw
      - run: pnpm --dir js validate:package

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip
        working-directory: python
      - run: python -m pip install -e ".[dev]"
        working-directory: python
      - run: python -m ruff check .
        working-directory: python
      - run: python -m ruff format --check .
        working-directory: python
      - run: python -m pytest
        working-directory: python
      - run: python scripts/build_package.py
        working-directory: python
      - run: python scripts/validate_package.py
        working-directory: python
